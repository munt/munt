name: Build Qt

on:
  workflow_dispatch

jobs:
  fetch-qt:
    runs-on: ubuntu-latest

    steps:
    - name: Cache qt sources
      id: cache-qt
      uses: actions/cache@v5
      with:
        key: qt-src-${{ vars.QT_REVISION }}
        path: qt5
        enableCrossOsArchive: 'true'
        lookup-only: 'true'

    - name: Get super repo
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: git clone --depth=1 --revision=${{ vars.QT_REVISION }} https://code.qt.io/qt/qt5.git

    - name: Get submodules
      if: steps.cache-qt.outputs.cache-hit != 'true'
      working-directory: qt5
      run: git submodule update --init --depth=1 qtbase qtshadertools qtmultimedia

  build-qt:
    needs: fetch-qt
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    env:
      CMAKE_CONFIG_FLAGS: >-
        -S qt5 -B build -G Ninja
        -D BUILD_SHARED_LIBS:BOOL=OFF
        -D CMAKE_BUILD_TYPE=Release
        -D CMAKE_INSTALL_PREFIX=stage
      QT_FEATURE_FLAGS: >-
        -D FEATURE_androiddeployqt:BOOL=OFF
        -D FEATURE_macdeployqt:BOOL=OFF
        -D FEATURE_network:BOOL=OFF
        -D FEATURE_pdf:BOOL=OFF
        -D FEATURE_printsupport:BOOL=OFF
        -D FEATURE_testlib:BOOL=OFF
        -D FEATURE_sql:BOOL=OFF
        -D FEATURE_windeployqt:BOOL=OFF
        -D FEATURE_xml:BOOL=OFF
        -D INPUT_libjpeg:STRING=no

    steps:
    - name: Get qt sources
      id: cache-qt
      uses: actions/cache@v5
      with:
        key: qt-src-${{ vars.QT_REVISION }}
        path: qt5
        enableCrossOsArchive: 'true'
        fail-on-cache-miss: 'true'

    - name: Assemble for Windows
      if: runner.os == 'Windows'
      shell: cmd
      run: >
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        && cmake ${{ env.CMAKE_CONFIG_FLAGS }}
        -D FEATURE_static_runtime:BOOL=ON
        ${{ env.QT_FEATURE_FLAGS }}
        && cmake --build build
        && cmake --install build
        && echo QT_ARTIFACT=${{ vars.QT_ARTIFACT_WIN }}>> %GITHUB_ENV%

    - name: Assemble for macOS
      if: runner.os == 'macOS'
      run: |
        cmake ${{ env.CMAKE_CONFIG_FLAGS }} ${{ env.QT_FEATURE_FLAGS }}
        cmake --build build
        cmake --install build
        echo QT_ARTIFACT="${{ vars.QT_ARTIFACT_MACOS }}" >> $GITHUB_ENV

    - name: Assemble for Linux
      if: runner.os == 'Linux'
      run: |
        echo QT_ARTIFACT="${{ vars.QT_ARTIFACT_LINUX }}" >> $GITHUB_ENV
        cat <<'EOF' >> build.sh
        #!/bin/bash
        set -e
        dnf update -y
        dnf install -y gcc-toolset-10-gcc-c++ cmake ninja-build \
          gtk3-devel libX11-devel xcb-util-devel xcb-util-cursor-devel xcb-util-image-devel \
          xcb-util-keysyms-devel xcb-util-renderutil-devel xcb-util-wm-devel libxkbcommon-devel \
          libxkbcommon-x11-devel pulseaudio-libs-devel
        source /opt/rh/gcc-toolset-10/enable
        cd /home/munt
        cmake ${{ env.CMAKE_CONFIG_FLAGS }} ${{ env.QT_FEATURE_FLAGS }}
        cmake --build build
        cmake --install build
        EOF
        chmod a+x build.sh
        podman run --mount type=bind,source=.,destination=/home/munt \
          --rm \
          ghcr.io/almalinux/8-toolbox /home/munt/build.sh

    - name: Pack
      run: tar czf $QT_ARTIFACT stage

    - uses: actions/upload-artifact@v7
      name: Upload
      with:
        path: ${{ env.QT_ARTIFACT }}
        archive: false
